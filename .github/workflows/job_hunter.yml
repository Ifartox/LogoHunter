name: Job Hunter Pipeline

on:
  schedule:
    # Esegue ogni 4 ore (ore 04, 08, 12, 16, 20 UTC)
    - cron: '0 4,8,12,16,20 * * *'
  # Consente l'avvio manuale dalla scheda "Actions" di GitHub
  workflow_dispatch:

# FONDAMENTALE: Assegna i permessi per salvare e fare il push del database aggiornato
permissions:
  contents: write

jobs:
  run-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice della repository
        uses: actions/checkout@v4

      - name: Configura ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui Scansione e Notifiche
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Salva aggiornamenti del database SQLite
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Crea la cartella data se non esiste e traccia il file jobs.db
          git add -f data/jobs.db
          # Esegue il commit solo se il file del database ha subito variazioni
          git commit -m "Aggiornamento automatico annunci visti [skip ci]" || echo "Nessuna modifica al database da salvare."
          git push
