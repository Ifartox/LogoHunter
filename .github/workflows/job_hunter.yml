name: Job Hunter Pipeline

on:
  schedule:
    # Esegue ogni 4 ore (minuto 0, alle ore 04, 08, 12, 16, 20 UTC)
    - cron: '0 4,8,12,16,20 * * *'
  # Consente anche l'avvio manuale dalla scheda "Actions" di GitHub
  workflow_dispatch:

jobs:
  run-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice della repository
        uses: actions/checkout@v4

      - name: Configura ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui Scansione e Notifiche
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          CV_FILE_PATH: "cv/curriculum.pdf"
        run: |
          python main.py

      - name: Salva aggiornamenti del database SQLite
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db || true
          git commit -m "Auto-aggiornamento annunci e stati [skip ci]" || exit 0
          git push
