name: Job Hunter Pipeline

on:
  schedule:
    - cron: '0 4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice della repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui Scansione e Notifiche
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Salva e persisti il database SQLite
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/jobs.db || true
          if git status --porcelain | grep -q "jobs.db"; then
            git commit -m "Salvataggio automatico database annunci [skip ci]"
            git pull --rebase
            git push origin main
          else
            echo "Nessun nuovo annuncio: database invariato."
          fi
